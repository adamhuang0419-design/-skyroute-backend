<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark" id="colorSchemeMeta">
<title>Skyroute Admin</title>
<script>
(function(){
  var t; try{ t = localStorage.getItem('skyroute-theme'); }catch(e){}
  document.documentElement.setAttribute('data-theme', t==='light' ? 'light' : 'dark');
})();
</script>
<style>
:root, [data-theme="dark"]{
  --bg:#050507; --panel:rgba(255,255,255,0.035); --panel-border:rgba(255,255,255,0.08);
  --glass-bg:rgba(255,255,255,0.07); --glass-border:rgba(255,255,255,0.22);
  --ink:#f5f5f7; --ink-soft:#96969e; --ink-faint:#5c5c63; --line:rgba(255,255,255,0.08);
  --menu-bg:#0d0d10; --tint-1:rgba(255,255,255,0.03); --tint-2:rgba(255,255,255,0.045); --tint-3:rgba(255,255,255,0.07);
  --a1:#7c7cf0; --a2:#e36bc9; --a3:#5ac8fa; --danger:#ff5b52; --success:#39d98a;
}
[data-theme="light"]{
  --bg:#f2f2f5; --panel:rgba(255,255,255,0.78); --panel-border:rgba(0,0,0,0.06);
  --glass-bg:rgba(255,255,255,0.6); --glass-border:rgba(0,0,0,0.12);
  --ink:#17171a; --ink-soft:#68686f; --ink-faint:#9a9aa1; --line:rgba(0,0,0,0.08);
  --menu-bg:#ffffff; --tint-1:rgba(0,0,0,0.025); --tint-2:rgba(0,0,0,0.035); --tint-3:rgba(0,0,0,0.055);
  --a1:#5b4fd6; --a2:#c2338f; --a3:#0a84c4; --danger:#d92d24; --success:#0f9d58;
}
*{box-sizing:border-box;}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;}
.wrap{max-width:1100px;margin:0 auto;padding:clamp(20px,4vw,44px);}
.icon-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--tint-2);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;}
.icon-btn svg{width:17px;height:17px;}
.icon-moon{display:none;} [data-theme="light"] .icon-sun{display:none;} [data-theme="light"] .icon-moon{display:block;}
.panel{background:var(--panel);backdrop-filter:blur(24px) saturate(140%);-webkit-backdrop-filter:blur(24px) saturate(140%);border:1px solid var(--panel-border);border-radius:22px;padding:28px;box-shadow:0 24px 60px rgba(0,0,0,0.3);}
h1{font-size:26px;font-weight:800;letter-spacing:-0.02em;margin:0;}
input,select{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--tint-1);padding:0 14px;font-size:15px;color:var(--ink);font-family:inherit;appearance:none;-webkit-appearance:none;}
input:focus,select:focus{outline:none;border-color:var(--glass-border);background:var(--glass-bg);}
button{font-family:inherit;cursor:pointer;}
.btn{height:44px;border-radius:12px;border:none;font-size:14px;font-weight:700;padding:0 18px;display:inline-flex;align-items:center;gap:6px;}
.btn-primary{background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;}
.btn-secondary{background:var(--tint-2);color:var(--ink);border:1px solid var(--line);}
.btn-danger{background:var(--danger);color:#fff;}
.btn-danger:disabled{opacity:.4;cursor:not-allowed;}

#loginView{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.login-panel{width:100%;max-width:360px;text-align:center;}
.login-panel h1{margin-bottom:22px;}
.login-panel input{margin-bottom:12px;}
.error{color:var(--danger);font-size:13px;margin:8px 0 0;}

#dashView{display:none;}
header.admin-top{display:flex;align-items:center;gap:12px;margin-bottom:24px;}
.stats-row{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:20px;}
@media (min-width:700px){ .stats-row{grid-template-columns:repeat(4,1fr);} }
.stat-card{background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:16px;padding:18px;}
.stat-card .sv{font-size:26px;font-weight:800;letter-spacing:-0.02em;}
.stat-card .sl{font-size:12px;color:var(--ink-soft);margin-top:4px;}

.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px;}
.filters input,.filters select{width:auto;min-width:140px;flex:1;}

.table-wrap{overflow-x:auto;}
.col-schedule{min-width:230px;}
.leg-line{font-size:12px;line-height:1.6;white-space:nowrap;}
.leg-line+.leg-line{margin-top:5px;}
.leg-label{font-weight:700;}
.leg-date{color:var(--ink-soft);}
.leg-time{font-weight:600;}
.leg-dur{color:var(--ink-soft);}
.cards-wrap{display:none;}
.order-card-admin{background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:14px;padding:14px;margin-bottom:10px;}
.oca-top{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:700;margin-bottom:6px;}
.oca-sub{font-size:12px;color:var(--ink-soft,var(--ink));opacity:0.85;margin-bottom:2px;}
.oca-route{font-size:12px;color:var(--ink-soft,var(--ink));opacity:0.85;margin-bottom:8px;}
.oca-leg{font-size:11px;color:var(--ink-soft,var(--ink));opacity:0.75;margin-bottom:2px;}
.oca-foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;}
.oca-price{font-size:15px;font-weight:800;}
@media (max-width:700px){
  .table-wrap{display:none;}
  .cards-wrap{display:block;}
  .filters{flex-direction:column;}
  .filters input,.filters select,.filters button{width:100%;min-width:0;}
}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:820px;}
th{text-align:left;font-size:12px;color:var(--ink-soft);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;}
td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap;}
tr:last-child td{border-bottom:none;}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;}
.badge-confirmed{background:rgba(57,217,138,0.15);color:var(--success);}
.badge-refunded{background:rgba(255,91,82,0.15);color:var(--danger);}
.empty{text-align:center;padding:40px 0;color:var(--ink-soft);font-size:14px;}
</style>
</head>
<body>

<div id="loginView">
  <div class="login-panel panel">
    <h1>Skyroute 後台</h1>
    <input type="password" id="pwInp" placeholder="管理密碼">
    <button class="btn btn-primary" id="loginBtn" style="width:100%;justify-content:center;">登入</button>
    <p class="error" id="loginError" style="display:none;"></p>
  </div>
</div>

<div id="dashView">
  <div class="wrap">
    <header class="admin-top">
      <h1 style="flex:1;">Skyroute 後台</h1>
      <button type="button" class="icon-btn" id="themeToggle" aria-label="切換淺色／深色模式">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <button type="button" class="btn btn-secondary" id="logoutBtn">登出</button>
    </header>

    <div class="stats-row">
      <div class="stat-card"><div class="sv" id="statTotal">–</div><div class="sl">總訂單數</div></div>
      <div class="stat-card"><div class="sv" id="statRevenue">–</div><div class="sl">總營收（未退票）</div></div>
      <div class="stat-card"><div class="sv" id="statToday">–</div><div class="sl">今日訂單</div></div>
      <div class="stat-card"><div class="sv" id="statRefunded">–</div><div class="sl">已退票</div></div>
    </div>

    <div class="panel">
      <div class="filters">
        <input type="text" id="fSearch" placeholder="搜尋訂位代號／姓名／Email">
        <select id="fStatus"><option value="">全部狀態</option><option value="confirmed">已確認</option><option value="refunded">已退票</option></select>
        <input type="date" id="fFrom" title="起始日期">
        <input type="date" id="fTo" title="結束日期">
        <button type="button" class="btn btn-secondary" id="filterBtn">篩選</button>
        <button type="button" class="btn btn-secondary" id="exportBtn">匯出 CSV</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>訂位代號</th><th>旅客</th><th>航班</th><th>航線</th><th>航班時間</th><th>金額</th><th>狀態</th><th>建立時間</th><th></th></tr></thead>
          <tbody id="ordersBody"></tbody>
        </table>
      </div>
      <div class="cards-wrap" id="ordersCards"></div>
      <div class="empty" id="emptyMsg" style="display:none;">沒有符合條件的訂單</div>
    </div>
  </div>
</div>

<script>
(function(){
  const $ = id => document.getElementById(id);

  function applyTheme(theme){
    document.documentElement.setAttribute('data-theme', theme);
    $('colorSchemeMeta').setAttribute('content', theme);
    try{ localStorage.setItem('skyroute-theme', theme); }catch(e){}
  }
  $('themeToggle').addEventListener('click', function(){
    applyTheme(document.documentElement.getAttribute('data-theme')==='light' ? 'dark' : 'light');
  });

  function getPw(){ try{ return sessionStorage.getItem('skyroute-admin-pw'); }catch(e){ return null; } }
  function setPw(pw){ try{ sessionStorage.setItem('skyroute-admin-pw', pw); }catch(e){} }
  function clearPw(){ try{ sessionStorage.removeItem('skyroute-admin-pw'); }catch(e){} }

  function fmtMoney(n){ return 'NT$' + Math.round(n||0).toLocaleString('en-US'); }

  async function adminFetch(url, opts){
    opts = opts || {};
    opts.headers = Object.assign({}, opts.headers, { 'X-Admin-Password': getPw() || '' });
    const res = await fetch(url, opts);
    if(res.status === 401){ showLogin('請重新登入'); throw new Error('unauthorized'); }
    return res;
  }

  function showLogin(err){
    $('loginView').style.display='flex'; $('dashView').style.display='none';
    if(err){ $('loginError').textContent=err; $('loginError').style.display=''; }
  }
  function showDash(){
    $('loginView').style.display='none'; $('dashView').style.display='block';
    loadStats(); loadOrders();
  }

  $('loginBtn').addEventListener('click', async function(){
    const pw = $('pwInp').value;
    $('loginError').style.display='none';
    try{
      const res = await fetch('/api/admin/verify', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ password: pw }) });
      const data = await res.json();
      if(!res.ok){ $('loginError').textContent = data.error || '登入失敗'; $('loginError').style.display=''; return; }
      setPw(pw); showDash();
    }catch(e){ $('loginError').textContent='連線失敗，請稍後再試'; $('loginError').style.display=''; }
  });
  $('pwInp').addEventListener('keydown', function(e){ if(e.key==='Enter') $('loginBtn').click(); });

  $('logoutBtn').addEventListener('click', function(){ clearPw(); showLogin(); });

  async function loadStats(){
    try{
      const res = await adminFetch('/api/admin/stats');
      const s = await res.json();
      $('statTotal').textContent = s.totalBookings;
      $('statRevenue').textContent = fmtMoney(s.totalRevenue);
      $('statToday').textContent = s.todayBookings;
      $('statRefunded').textContent = s.refundedCount;
    }catch(e){}
  }

  function badge(status){
    return status==='refunded' ? '<span class="badge badge-refunded">已退票</span>' : '<span class="badge badge-confirmed">已確認</span>';
  }

  function makeRefundBtn(o, className){
    const btn = document.createElement('button');
    btn.type='button'; btn.className=className; btn.textContent = o.status==='refunded' ? '已退票' : '退票';
    btn.disabled = o.status==='refunded';
    btn.addEventListener('click', async function(){
      if(!confirm('確定要將 '+o.referenceCode+' 標記為已退票嗎？')) return;
      btn.disabled = true;
      try{
        const r = await adminFetch('/api/admin/bookings/'+encodeURIComponent(o.referenceCode)+'/refund', { method:'POST' });
        if(!r.ok){ const d = await r.json(); alert(d.error||'退票失敗'); btn.disabled=false; return; }
        loadOrders(); loadStats();
      }catch(e){ btn.disabled=false; }
    });
    return btn;
  }

  function legsOf(o){
    const legs = (o.legs && o.legs.length) ? o.legs : [{date:'',dep:o.depTime,arr:o.arrTime,duration:''}];
    return legs.map(function(leg,i){
      let label='';
      if(legs.length===2) label = i===0?'去程':'回程';
      else if(legs.length>=3) label = '第'+(i+1)+'段';
      return { label:label, date:leg.date||'—', time:leg.dep+'–'+leg.arr, duration:leg.duration||'—' };
    });
  }
  function legLineHtml(leg){
    return '<div class="leg-line">'+(leg.label?'<span class="leg-label">'+leg.label+'</span> ':'')+
      '<span class="leg-date">'+leg.date+'</span> <span class="leg-time">'+leg.time+'</span> '+
      '<span class="leg-dur">（'+leg.duration+'）</span></div>';
  }

  async function loadOrders(){
    const params = new URLSearchParams();
    if($('fSearch').value.trim()) params.set('search', $('fSearch').value.trim());
    if($('fStatus').value) params.set('status', $('fStatus').value);
    if($('fFrom').value) params.set('from', $('fFrom').value);
    if($('fTo').value) params.set('to', $('fTo').value);
    try{
      const res = await adminFetch('/api/admin/bookings?'+params.toString());
      const orders = await res.json();
      const body = $('ordersBody'); body.innerHTML='';
      const cards = $('ordersCards'); cards.innerHTML='';
      $('emptyMsg').style.display = orders.length ? 'none' : '';

      orders.forEach(function(o){
        const legLines = legsOf(o);

        const tr = document.createElement('tr');
        tr.innerHTML =
          '<td>'+o.referenceCode+'</td>'+
          '<td>'+o.passengerName+'<br><span style="color:var(--ink-soft);font-size:12px;">'+o.passengerEmail+'</span></td>'+
          '<td>'+o.airline+' '+o.flightNo+'</td>'+
          '<td>'+o.origin+' → '+o.destination+'</td>'+
          '<td class="col-schedule">'+legLines.map(legLineHtml).join('')+'</td>'+
          '<td>'+fmtMoney(o.totalPrice)+'</td>'+
          '<td>'+badge(o.status)+'</td>'+
          '<td style="color:var(--ink-soft);font-size:12px;">'+new Date(o.createdAt).toLocaleString('zh-TW')+'</td>'+
          '<td></td>';
        tr.lastElementChild.appendChild(makeRefundBtn(o, 'btn btn-danger'));
        body.appendChild(tr);

        const card = document.createElement('div'); card.className='order-card-admin';
        card.innerHTML =
          '<div class="oca-top"><span>'+o.referenceCode+'</span>'+badge(o.status)+'</div>'+
          '<div class="oca-sub">'+o.passengerName+' · '+o.passengerEmail+'</div>'+
          '<div class="oca-route">'+o.airline+' '+o.flightNo+'　'+o.origin+' → '+o.destination+'</div>'+
          legLines.map(legLineHtml).join('')+
          '<div class="oca-foot"><span class="oca-price">'+fmtMoney(o.totalPrice)+'</span></div>';
        card.querySelector('.oca-foot').appendChild(makeRefundBtn(o, 'btn btn-danger'));
        cards.appendChild(card);
      });
    }catch(e){}
  }
  $('filterBtn').addEventListener('click', loadOrders);
  $('exportBtn').addEventListener('click', async function(){
    try{
      const res = await fetch('/api/admin/export.csv', { headers:{ 'X-Admin-Password': getPw()||'' } });
      if(!res.ok){ alert('匯出失敗'); return; }
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href=url; a.download='skyroute-bookings.csv'; a.click();
      URL.revokeObjectURL(url);
    }catch(e){ alert('匯出失敗'); }
  });

  if(getPw()){ showDash(); } else { showLogin(); }
})();
</script>
</body>
</html>
