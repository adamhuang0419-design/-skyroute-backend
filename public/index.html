<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Skyroute</title>
<style>
:root{
  --bg:#050507;
  --panel:rgba(255,255,255,0.035);
  --panel-border:rgba(255,255,255,0.08);
  --glass-bg:rgba(255,255,255,0.07);
  --glass-border:rgba(255,255,255,0.22);
  --ink:#f5f5f7;
  --ink-soft:#96969e;
  --ink-faint:#5c5c63;
  --line:rgba(255,255,255,0.08);
  --a1:#7c7cf0;
  --a2:#e36bc9;
  --a3:#5ac8fa;
  --danger:#ff5b52;
}
*{box-sizing:border-box;}
body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  background:var(--bg);
  background-image:
    radial-gradient(720px 520px at 12% -8%, rgba(124,124,240,0.16), transparent 60%),
    radial-gradient(640px 480px at 100% 18%, rgba(227,107,201,0.11), transparent 60%),
    radial-gradient(560px 420px at 30% 100%, rgba(90,200,250,0.08), transparent 60%);
  padding:52px 18px;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif;
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
.shell{width:100%;max-width:430px;perspective:1400px;}
header.top{margin-bottom:26px;padding:0 6px;display:flex;align-items:baseline;gap:10px;}
header.top .mark{font-size:15px;font-weight:800;letter-spacing:0.06em;text-transform:uppercase;}
header.top .dot{width:6px;height:6px;border-radius:50%;background:linear-gradient(135deg,var(--a1),var(--a2));}
.panel{
  position:relative;
  background:var(--panel);
  backdrop-filter:blur(28px) saturate(140%);
  -webkit-backdrop-filter:blur(28px) saturate(140%);
  border-radius:26px;
  padding:34px 26px 28px;
  border:1px solid var(--panel-border);
  box-shadow:0 30px 80px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.05);
}
.track{display:flex;gap:5px;margin-bottom:30px;}
.track i{flex:1;height:3px;border-radius:2px;background:var(--line);font-style:normal;}
.track i.done{background:var(--a1);}
.track i.on{background:linear-gradient(90deg,var(--a1),var(--a2));}
h2{font-size:33px;font-weight:800;letter-spacing:-0.035em;line-height:1.08;margin:0 0 24px;}
.field{margin-bottom:16px;position:relative;}
.field label{display:block;font-size:12px;font-weight:600;letter-spacing:0.02em;color:var(--ink-soft);margin-bottom:7px;}
.ico-input{position:relative;}
.ico-input svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--ink-soft);pointer-events:none;z-index:1;}
input,select{
  width:100%;height:48px;border-radius:14px;border:1px solid var(--line);
  background:rgba(255,255,255,0.03);padding:0 14px;font-size:16px;color:var(--ink);
  font-family:inherit;appearance:none;-webkit-appearance:none;
  transition:all .25s cubic-bezier(.16,1,.3,1);position:relative;
}
.ico-input input,.ico-input select{padding-left:41px;}
input:focus,select:focus{
  outline:none;border-color:var(--glass-border);
  background:var(--glass-bg);
  backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);
  box-shadow:0 12px 34px rgba(0,0,0,0.4), 0 0 0 4px rgba(124,124,240,0.14);
}
input:disabled,select:disabled,button:disabled{opacity:0.5;cursor:not-allowed;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.btn{
  width:100%;height:50px;border-radius:16px;border:none;
  font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;letter-spacing:-0.01em;
  display:flex;align-items:center;justify-content:center;gap:8px;
  transition:transform .15s cubic-bezier(.16,1,.3,1),box-shadow .2s ease,background .2s ease;
}
.btn svg{width:18px;height:18px;flex:none;}
.btn:active{transform:scale(0.965);}
.btn-primary{background:linear-gradient(135deg,#fff,#e2e2e6);color:#0a0a0c;}
.btn-primary:hover{box-shadow:0 10px 28px rgba(255,255,255,0.12);}
.btn-secondary{background:rgba(255,255,255,0.05);color:var(--ink);border:1px solid var(--line);}
.btn-secondary:hover{background:var(--glass-bg);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-color:var(--glass-border);}
.btn-icon{width:50px;flex:none;padding:0;}
.btn-row{display:flex;gap:10px;}
.btn-row .btn:not(.btn-icon){flex:1;}
.error{font-size:13px;color:var(--danger);margin:-6px 0 14px;}
.meta{font-size:14px;color:var(--ink-soft);margin:-16px 0 20px;}

/* segmented trip-type control */
.seg{display:flex;background:rgba(255,255,255,0.04);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:18px;}
.seg-btn{flex:1;height:38px;border:none;background:transparent;color:var(--ink-soft);font-family:inherit;font-size:14px;font-weight:700;border-radius:10px;cursor:pointer;transition:all .2s ease;}
.seg-btn.active{background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;}

/* autocomplete */
.acomp-menu{
  position:absolute;top:calc(100% + 8px);left:0;right:0;z-index:70;
  background:#0d0d10;backdrop-filter:blur(28px) saturate(150%);-webkit-backdrop-filter:blur(28px) saturate(150%);
  border:1px solid var(--glass-border);border-radius:16px;padding:6px;
  box-shadow:0 20px 50px rgba(0,0,0,0.5);max-height:230px;overflow-y:auto;display:none;
}
.acomp-menu.open{display:block;animation:menuIn .18s cubic-bezier(.16,1,.3,1);}
.acomp-opt{padding:11px 13px;border-radius:10px;cursor:pointer;transition:background .15s ease;}
.acomp-opt:hover{background:rgba(255,255,255,0.07);}
.acomp-opt .a-city{font-size:15px;font-weight:700;}
.acomp-opt .a-name{font-size:12px;color:var(--ink-soft);margin-top:2px;}
.acomp-empty{padding:14px;font-size:13px;color:var(--ink-soft);text-align:center;}

/* generic custom select (cabin class) */
.csel{position:relative;}
.csel-trigger{
  width:100%;height:48px;border-radius:14px;border:1px solid var(--line);
  background:rgba(255,255,255,0.03);padding:0 14px 0 41px;font-size:16px;color:var(--ink);
  font-family:inherit;display:flex;align-items:center;position:relative;cursor:pointer;
  transition:all .25s cubic-bezier(.16,1,.3,1);text-align:left;
}
.csel-trigger:focus{outline:none;}
.csel.open .csel-trigger{
  border-color:var(--glass-border);background:var(--glass-bg);
  backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);
  box-shadow:0 12px 34px rgba(0,0,0,0.4), 0 0 0 4px rgba(124,124,240,0.14);
}
.csel-trigger svg.csel-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--ink-soft);}
.csel-trigger .csel-value{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.csel-trigger svg.csel-chevron{width:15px;height:15px;color:var(--ink-soft);transition:transform .25s ease;flex:none;}
.csel.open .csel-trigger svg.csel-chevron{transform:rotate(180deg);}
.csel-menu{
  position:absolute;top:calc(100% + 8px);left:0;right:0;z-index:60;
  background:#0d0d10;backdrop-filter:blur(28px) saturate(150%);-webkit-backdrop-filter:blur(28px) saturate(150%);
  border:1px solid var(--glass-border);border-radius:16px;padding:6px;
  box-shadow:0 20px 50px rgba(0,0,0,0.5);max-height:280px;overflow-y:auto;display:none;
}
.csel.open .csel-menu{display:block;animation:menuIn .18s cubic-bezier(.16,1,.3,1);}
@keyframes menuIn{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:translateY(0);}}
.csel-opt{padding:11px 13px;font-size:15px;color:var(--ink);border-radius:10px;cursor:pointer;transition:background .15s ease;font-family:inherit;}
.csel-opt:hover{background:rgba(255,255,255,0.07);}
.csel-opt.sel{background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;font-weight:700;}
.csel-native{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;}

/* passenger stepper popover */
.pax-menu{padding:14px;}
.pax-row{display:flex;align-items:center;justify-content:space-between;padding:9px 2px;}
.pax-label{font-size:14px;font-weight:700;}
.pax-sub{font-size:12px;color:var(--ink-soft);margin-top:2px;}
.stepper{display:flex;align-items:center;gap:12px;}
.step-btn{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,0.04);color:var(--ink);font-size:17px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:inherit;}
.step-btn:disabled{opacity:.3;cursor:not-allowed;}
.step-btn:not(:disabled):hover{border-color:var(--a3);}
.step-val{min-width:18px;text-align:center;font-size:15px;font-weight:700;}
.pax-done{margin-top:10px;height:42px;font-size:14px;}

/* direct-only toggle */
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:2px 2px 18px;font-size:14px;font-weight:600;cursor:pointer;}
.switch{position:relative;width:44px;height:26px;flex:none;}
.switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1;}
.switch-track{position:absolute;inset:0;background:rgba(255,255,255,0.12);border-radius:14px;transition:background .2s ease;}
.switch-track::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s cubic-bezier(.16,1,.3,1);}
.switch input:checked ~ .switch-track{background:linear-gradient(135deg,var(--a1),var(--a2));}
.switch input:checked ~ .switch-track::after{transform:translateX(18px);}

.flight-list{border-top:1px solid var(--line);margin-bottom:22px;}
.flight-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:17px 12px;margin:0 -12px;border-bottom:1px solid var(--line);
  border-radius:16px;cursor:pointer;background:transparent;border:1px solid transparent;
  transition:all .25s cubic-bezier(.16,1,.3,1);
}
.flight-row:hover{background:var(--glass-bg);backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);border-color:var(--glass-border);transform:translateY(-1px);box-shadow:0 14px 32px rgba(0,0,0,0.35);}
.flight-row .airline{font-size:15px;font-weight:700;letter-spacing:-0.01em;}
.flight-row .time{font-size:13px;color:var(--ink-soft);margin-top:4px;}
.flight-row .time.ret{margin-top:2px;}
.flight-row .fl-r{text-align:right;}
.flight-row .price{font-size:17px;font-weight:800;letter-spacing:-0.02em;background:linear-gradient(135deg,var(--a3),var(--a1));-webkit-background-clip:text;background-clip:text;color:transparent;}
.flight-row .tag{font-size:11px;color:var(--ink-faint);margin-top:4px;}
.seat-legend{display:flex;gap:16px;font-size:12px;color:var(--ink-soft);margin:0 0 18px;}
.seat-legend span{display:inline-flex;align-items:center;gap:6px;}
.sw{width:9px;height:9px;border-radius:3px;display:inline-block;}
.seat-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px;margin-bottom:8px;}
.seat{aspect-ratio:1;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,0.03);font-size:11px;color:var(--ink-soft);font-family:inherit;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s cubic-bezier(.16,1,.3,1);}
.seat:hover:not(.taken):not(.sel){border-color:var(--a3);}
.seat.taken{background:rgba(255,255,255,0.015);color:#333338;border-color:transparent;cursor:not-allowed;}
.seat.sel{background:linear-gradient(135deg,var(--a1),var(--a2));border-color:transparent;color:#fff;transform:scale(1.08);box-shadow:0 8px 20px rgba(124,124,240,0.45);}
.summary-card{background:var(--glass-bg);backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);border:1px solid var(--glass-border);border-radius:18px;padding:20px 20px 6px;margin-bottom:20px;}
.sum-row{display:flex;justify-content:space-between;font-size:14px;padding-bottom:13px;}
.sum-row .k{color:var(--ink-soft);}
.sum-total{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding:15px 0;font-size:17px;font-weight:800;}
.success-mark{width:60px;height:60px;border-radius:50%;margin:4px auto 20px;position:relative;background:linear-gradient(135deg,var(--a1),var(--a2),var(--a3));display:flex;align-items:center;justify-content:center;box-shadow:0 12px 32px rgba(124,124,240,0.4);}
.success-mark svg{width:27px;height:27px;color:#fff;}
.ref{text-align:center;font-size:12px;color:var(--ink-soft);margin-bottom:3px;letter-spacing:0.02em;}
.ref-code{text-align:center;font-size:24px;font-weight:800;letter-spacing:0.05em;margin-bottom:28px;background:linear-gradient(135deg,var(--a3),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent;}
.ai-loading{padding:30px 0;text-align:center;}
.ai-loading-bar{height:3px;width:100%;border-radius:2px;overflow:hidden;position:relative;background:var(--line);margin-bottom:16px;}
.ai-loading-bar::after{content:'';position:absolute;top:0;bottom:0;width:45%;background:linear-gradient(90deg,transparent,var(--a1),var(--a2),var(--a3),transparent);animation:shimmerSlide 1.3s ease-in-out infinite;}
@keyframes shimmerSlide{0%{transform:translateX(-110%);}100%{transform:translateX(320%);}}
.ai-loading p{font-size:13px;color:var(--ink-soft);margin:0;animation:breathe 1.8s ease-in-out infinite;}
@keyframes breathe{0%,100%{opacity:.45;}50%{opacity:1;}}
.step{display:none;}
.step.active{display:block;animation:stepIn .55s cubic-bezier(.16,1,.3,1);transform-style:preserve-3d;}
@keyframes stepIn{from{opacity:0;transform:translateY(26px) translateZ(-50px) rotateX(6deg);}to{opacity:1;transform:translateY(0) translateZ(0) rotateX(0);}}
footer.note{text-align:center;font-size:11px;color:var(--ink-faint);margin-top:22px;letter-spacing:0.01em;}
@media (prefers-reduced-motion:reduce){.step.active{animation:none;}.ai-loading-bar::after{animation:none;}.ai-loading p{animation:none;}}

@media (min-width:640px){
  .shell{max-width:580px;}
  .panel{padding:46px 42px 40px;}
  h2{font-size:38px;}
  .row2{grid-template-columns:1fr 1fr 1fr;}
}
@media (min-width:1024px){
  .shell{max-width:720px;}
  .panel{padding:54px 56px 48px;}
}
</style>
</head>
<body>
<div class="shell">
  <header class="top"><span class="dot"></span><span class="mark">Skyroute</span></header>
  <div class="panel">
    <div class="track"><i id="t1"></i><i id="t2"></i><i id="t3"></i><i id="t4"></i><i id="t5"></i></div>

    <div class="step" id="step1">
      <h2>去哪裡？</h2>

      <div class="seg" id="tripSeg">
        <button type="button" class="seg-btn active" data-value="oneway">單程</button>
        <button type="button" class="seg-btn" data-value="roundtrip">來回</button>
      </div>

      <div class="field">
        <label for="fromInp">出發地</label>
        <div class="ico-input">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.5 7-12a7 7 0 0 0-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="9" r="2.3"/></svg>
          <input type="text" id="fromInp" placeholder="城市或機場" autocomplete="off" value="台北 TPE">
        </div>
        <div class="acomp-menu" id="fromMenu"></div>
        <input type="hidden" id="fromCode" value="TPE">
      </div>

      <div class="field">
        <label for="toInp">目的地</label>
        <div class="ico-input">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.5 7-12a7 7 0 0 0-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="9" r="2.3"/></svg>
          <input type="text" id="toInp" placeholder="城市或機場" autocomplete="off" value="東京 TYO">
        </div>
        <div class="acomp-menu" id="toMenu"></div>
        <input type="hidden" id="toCode" value="TYO">
      </div>

      <div class="row2">
        <div class="field">
          <label for="dateInp">去程日期</label>
          <div class="ico-input">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="16" rx="2.5"/><line x1="3.5" y1="10" x2="20.5" y2="10"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="16" y1="3" x2="16" y2="7"/></svg>
            <input type="date" id="dateInp">
          </div>
        </div>
        <div class="field" id="returnField" style="display:none;">
          <label for="returnDateInp">回程日期</label>
          <div class="ico-input">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="16" rx="2.5"/><line x1="3.5" y1="10" x2="20.5" y2="10"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="16" y1="3" x2="16" y2="7"/></svg>
            <input type="date" id="returnDateInp">
          </div>
        </div>
        <div class="field">
          <label for="cabinTrigger">艙等</label>
          <div class="csel" id="cabinCsel">
            <button type="button" class="csel-trigger" id="cabinTrigger" aria-haspopup="listbox" aria-expanded="false">
              <svg class="csel-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 16l20-5-3 7-4 1-2 4-2-6-9 3z"/></svg>
              <span class="csel-value">不限艙等</span>
              <svg class="csel-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
            <div class="csel-menu" role="listbox">
              <div class="csel-opt sel" data-value="any" role="option">不限艙等</div>
              <div class="csel-opt" data-value="economy" role="option">經濟艙</div>
              <div class="csel-opt" data-value="premium_economy" role="option">豪華經濟艙</div>
              <div class="csel-opt" data-value="business" role="option">商務艙</div>
              <div class="csel-opt" data-value="first" role="option">頭等艙</div>
            </div>
            <select id="cabinSel" class="csel-native" tabindex="-1" aria-hidden="true">
              <option value="any">不限艙等</option><option value="economy">經濟艙</option><option value="premium_economy">豪華經濟艙</option><option value="business">商務艙</option><option value="first">頭等艙</option>
            </select>
          </div>
        </div>
      </div>

      <div class="field">
        <label for="paxTrigger">乘客</label>
        <div class="csel" id="paxCsel">
          <button type="button" class="csel-trigger" id="paxTrigger" aria-haspopup="true" aria-expanded="false">
            <svg class="csel-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-3.5 3-6 7-6s7 2.5 7 6"/></svg>
            <span class="csel-value" id="paxSummary">1 大人</span>
            <svg class="csel-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div class="csel-menu pax-menu" id="paxMenu">
            <div class="pax-row">
              <div><div class="pax-label">大人</div><div class="pax-sub">12 歲以上</div></div>
              <div class="stepper">
                <button type="button" class="step-btn" data-field="adults" data-delta="-1">−</button>
                <span class="step-val" id="adultsVal">1</span>
                <button type="button" class="step-btn" data-field="adults" data-delta="1">+</button>
              </div>
            </div>
            <div class="pax-row">
              <div><div class="pax-label">小孩</div><div class="pax-sub">2–11 歲</div></div>
              <div class="stepper">
                <button type="button" class="step-btn" data-field="children" data-delta="-1">−</button>
                <span class="step-val" id="childrenVal">0</span>
                <button type="button" class="step-btn" data-field="children" data-delta="1">+</button>
              </div>
            </div>
            <div class="pax-row">
              <div><div class="pax-label">嬰兒</div><div class="pax-sub">2 歲以下</div></div>
              <div class="stepper">
                <button type="button" class="step-btn" data-field="infants" data-delta="-1">−</button>
                <span class="step-val" id="infantsVal">0</span>
                <button type="button" class="step-btn" data-field="infants" data-delta="1">+</button>
              </div>
            </div>
            <button type="button" class="btn btn-primary pax-done" id="paxDone">完成</button>
          </div>
        </div>
      </div>

      <label class="toggle-row" for="directOnly">
        只顯示直飛
        <span class="switch"><input type="checkbox" id="directOnly"><span class="switch-track"></span></span>
      </label>

      <p class="error" id="searchError" style="display:none;"></p>
      <button class="btn btn-primary" id="searchBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        搜尋航班
      </button>
    </div>

    <div class="step" id="step2">
      <h2>選擇航班</h2>
      <p class="meta" id="resultsMeta"></p>
      <div class="flight-list" id="flightList"></div>
      <button class="btn btn-secondary" id="backTo1" type="button">重新搜尋</button>
    </div>

    <div class="step" id="step3">
      <h2>選擇座位</h2>
      <p class="meta" id="seatMeta"></p>
      <div class="seat-legend">
        <span><i class="sw" style="background:rgba(255,255,255,0.05);border:1px solid var(--line);"></i>可選</span>
        <span><i class="sw" style="background:linear-gradient(135deg,var(--a1),var(--a2));"></i>已選</span>
        <span><i class="sw" style="background:rgba(255,255,255,0.02);"></i>已售出</span>
      </div>
      <div class="seat-grid" id="seatGrid"></div>
      <p class="error" id="seatError" style="display:none;margin-top:10px;"></p>
      <div class="btn-row" style="margin-top:22px;">
        <button class="btn btn-secondary btn-icon" id="backTo2" type="button" aria-label="上一步">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="11 6 5 12 11 18"/></svg>
        </button>
        <button class="btn btn-primary" id="toStep4" type="button">繼續</button>
      </div>
    </div>

    <div class="step" id="step4">
      <h2>旅客資料</h2>
      <div class="field"><label for="nameInp">姓名</label><input type="text" id="nameInp" placeholder="王小明"></div>
      <div class="field"><label for="emailInp">Email</label><input type="email" id="emailInp" placeholder="name@example.com"></div>
      <div class="field"><label for="phoneInp">電話</label><input type="tel" id="phoneInp" placeholder="0912-345-678"></div>
      <p class="error" id="passError" style="display:none;"></p>
      <div class="btn-row">
        <button class="btn btn-secondary btn-icon" id="backTo3" type="button" aria-label="上一步">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="11 6 5 12 11 18"/></svg>
        </button>
        <button class="btn btn-primary" id="toConfirm" type="button">確認訂購</button>
      </div>
    </div>

    <div class="step" id="step5">
      <div class="success-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <h2 style="text-align:center;">訂購完成</h2>
      <p class="ref">訂位代號</p>
      <p class="ref-code" id="refCode"></p>
      <div class="summary-card" id="summaryCard"></div>
      <button class="btn btn-secondary" id="restartBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><polyline points="21 3 21 9 15 9"/></svg>
        重新開始
      </button>
    </div>

  </div>
  <footer class="note">搜尋為 Duffel 真實航班資料（sandbox），選位與訂購存於真實資料庫</footer>
</div>

<script>
(function(){
  const state = {
    tripType:'oneway', fromCode:'TPE', toCode:'TYO', fromLabel:'台北 TPE', toLabel:'東京 TYO',
    date:'', returnDate:'', cabin:'any', directOnly:false,
    adults:1, children:0, infants:0,
    flight:null, currency:'TWD', flightId:null, seatId:null, seatLabel:null
  };
  const $ = id => document.getElementById(id);

  const d = new Date(); d.setDate(d.getDate()+14);
  $('dateInp').value = d.toISOString().slice(0,10);
  const rd = new Date(d); rd.setDate(rd.getDate()+7);
  $('returnDateInp').value = rd.toISOString().slice(0,10);

  function fmtMoney(n, currency){
    const cur = currency || 'TWD';
    const symbols = { TWD:'NT$', USD:'US$', GBP:'£', EUR:'€', JPY:'¥' };
    const prefix = symbols[cur] || (cur + ' ');
    return prefix + Math.round(n).toLocaleString('en-US');
  }

  // ---- trip type segmented control ----
  document.querySelectorAll('#tripSeg .seg-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('#tripSeg .seg-btn').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      state.tripType = btn.getAttribute('data-value');
      $('returnField').style.display = state.tripType === 'roundtrip' ? '' : 'none';
    });
  });

  // ---- generic custom select (cabin class) ----
  function buildCustomSelect(wrapId, onPick){
    const wrap = $(wrapId);
    const trigger = wrap.querySelector('.csel-trigger');
    const valueEl = wrap.querySelector('.csel-value');
    const menu = wrap.querySelector('.csel-menu');
    const opts = Array.from(menu.querySelectorAll('.csel-opt'));
    function close(){ wrap.classList.remove('open'); trigger.setAttribute('aria-expanded','false'); }
    function openMenu(){
      document.querySelectorAll('.csel.open').forEach(function(w){ if(w!==wrap) w.classList.remove('open'); });
      wrap.classList.add('open'); trigger.setAttribute('aria-expanded','true');
    }
    trigger.addEventListener('click', function(e){ e.stopPropagation(); wrap.classList.contains('open') ? close() : openMenu(); });
    opts.forEach(function(opt){
      opt.addEventListener('click', function(){
        opts.forEach(function(o){ o.classList.remove('sel'); });
        opt.classList.add('sel');
        valueEl.textContent = opt.textContent;
        close();
        if(onPick) onPick(opt.getAttribute('data-value'), opt.textContent);
      });
    });
    document.addEventListener('click', function(e){ if(!wrap.contains(e.target)) close(); });
    document.addEventListener('keydown', function(e){ if(e.key==='Escape') close(); });
  }
  buildCustomSelect('cabinCsel', function(val){ state.cabin = val; });

  // ---- passenger stepper popover ----
  const paxWrap = $('paxCsel');
  const paxTrigger = $('paxTrigger');
  function paxClose(){ paxWrap.classList.remove('open'); paxTrigger.setAttribute('aria-expanded','false'); }
  function paxOpen(){
    document.querySelectorAll('.csel.open').forEach(function(w){ if(w!==paxWrap) w.classList.remove('open'); });
    paxWrap.classList.add('open'); paxTrigger.setAttribute('aria-expanded','true');
  }
  paxTrigger.addEventListener('click', function(e){ e.stopPropagation(); paxWrap.classList.contains('open') ? paxClose() : paxOpen(); });
  document.addEventListener('click', function(e){ if(!paxWrap.contains(e.target)) paxClose(); });
  $('paxDone').addEventListener('click', paxClose);

  const PAX_LIMITS = { adults:[0,8], children:[0,5], infants:[0,3] };
  function updatePaxUI(){
    ['adults','children','infants'].forEach(function(f){
      $(f+'Val').textContent = state[f];
      const lim = PAX_LIMITS[f];
      wrapStepBtns(f, lim);
    });
    const parts = [];
    if(state.adults>0) parts.push(state.adults+' 大人');
    if(state.children>0) parts.push(state.children+' 小孩');
    if(state.infants>0) parts.push(state.infants+' 嬰兒');
    $('paxSummary').textContent = parts.length ? parts.join('、') : '請選擇人數';
  }
  function wrapStepBtns(field, lim){
    document.querySelectorAll('.step-btn[data-field="'+field+'"]').forEach(function(btn){
      const delta = parseInt(btn.getAttribute('data-delta'),10);
      const next = state[field] + delta;
      btn.disabled = next < lim[0] || next > lim[1];
    });
  }
  document.querySelectorAll('.step-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      const field = btn.getAttribute('data-field');
      const delta = parseInt(btn.getAttribute('data-delta'),10);
      const lim = PAX_LIMITS[field];
      const next = state[field] + delta;
      if(next < lim[0] || next > lim[1]) return;
      state[field] = next;
      updatePaxUI();
    });
  });
  updatePaxUI();

  // ---- direct-only toggle ----
  $('directOnly').addEventListener('change', function(){ state.directOnly = $('directOnly').checked; });

  // ---- place autocomplete ----
  function buildAutocomplete(inputId, menuId, hiddenField, onPick){
    const input = $(inputId), menu = $(menuId);
    let timer = null, current = [];
    input.addEventListener('focus', function(){ if(current.length) menu.classList.add('open'); });
    input.addEventListener('input', function(){
      const q = input.value.trim();
      clearTimeout(timer);
      if(q.length < 2){ menu.classList.remove('open'); return; }
      timer = setTimeout(async function(){
        try{
          const res = await fetch('/api/places?query='+encodeURIComponent(q));
          const items = await res.json();
          current = items || [];
          menu.innerHTML = '';
          if(!current.length){
            menu.innerHTML = '<div class="acomp-empty">找不到符合的地點</div>';
          } else {
            current.forEach(function(p){
              const row = document.createElement('div');
              row.className = 'acomp-opt';
              row.innerHTML = '<div class="a-city">'+p.cityName+' '+p.iataCode+'</div><div class="a-name">'+p.name+'</div>';
              row.addEventListener('click', function(){
                input.value = p.cityName+' '+p.iataCode;
                state[hiddenField] = p.iataCode;
                if(onPick) onPick(p);
                menu.classList.remove('open');
              });
              menu.appendChild(row);
            });
          }
          menu.classList.add('open');
        }catch(e){ menu.classList.remove('open'); }
      }, 250);
    });
    document.addEventListener('click', function(e){ if(!input.contains(e.target) && !menu.contains(e.target)) menu.classList.remove('open'); });
  }
  buildAutocomplete('fromInp','fromMenu','fromCode');
  buildAutocomplete('toInp','toMenu','toCode');

  function goStep(n){
    for(let i=1;i<=5;i++){ $('step'+i).classList.toggle('active', i===n); }
    for(let i=1;i<=5;i++){
      $('t'+i).classList.toggle('on', i===n);
      $('t'+i).classList.toggle('done', i<n);
    }
  }

  $('searchBtn').addEventListener('click', async function(){
    if(state.fromCode === state.toCode){ $('searchError').textContent='出發地與目的地不能相同'; $('searchError').style.display=''; return; }
    if(state.adults + state.children + state.infants < 1){ $('searchError').textContent='請至少選擇 1 位乘客'; $('searchError').style.display=''; return; }
    $('searchError').style.display='none';

    state.date = $('dateInp').value;
    state.returnDate = $('returnDateInp').value;
    state.fromLabel = $('fromInp').value;
    state.toLabel = $('toInp').value;

    const btn = $('searchBtn'); btn.disabled = true;
    try{
      const qs = new URLSearchParams({
        from: state.fromCode, to: state.toCode, date: state.date,
        tripType: state.tripType, cabin: state.cabin, directOnly: state.directOnly,
        adults: state.adults, children: state.children, infants: state.infants
      });
      if(state.tripType==='roundtrip') qs.set('returnDate', state.returnDate);
      const res = await fetch('/api/flights?'+qs.toString());
      const flights = await res.json();
      if(!res.ok) throw new Error(flights.error || 'search failed');

      const paxTotal = state.adults+state.children+state.infants;
      $('resultsMeta').textContent = state.fromLabel+' → '+state.toLabel+'　'+state.date+(state.tripType==='roundtrip' ? '～'+state.returnDate : '')+'　'+paxTotal+' 位乘客';
      const list = $('flightList'); list.innerHTML='';
      if(!flights.length){ list.innerHTML = '<p class="meta" style="margin:0;">這條航線目前沒有符合條件的航班</p>'; }
      flights.forEach(function(f){
        const row = document.createElement('div');
        row.className='flight-row';
        let html = '<div class="fl-l"><div class="airline">'+f.airline+' '+f.flightNo+'</div><div class="time">去程 '+f.dep+' – '+f.arr+'　'+f.duration+'</div>';
        if(f.returnInfo){ html += '<div class="time ret">回程 '+f.returnInfo.dep+' – '+f.returnInfo.arr+'　'+f.returnInfo.duration+'</div>'; }
        html += '</div><div class="fl-r"><div class="price">'+fmtMoney(f.totalPrice, f.currency)+'</div><div class="tag">'+(f.stops===0?'直飛':'轉機 '+f.stops+' 次')+'</div></div>';
        row.innerHTML = html;
        row.addEventListener('click', function(){ pickFlight(f); });
        list.appendChild(row);
      });
      goStep(2);
    }catch(e){
      $('searchError').textContent='搜尋失敗，請稍後再試';
      $('searchError').style.display='';
    }finally{
      btn.disabled = false;
    }
  });

  $('backTo1').addEventListener('click', function(){ goStep(1); });

  async function pickFlight(f){
    state.flight = f; state.seatId=null; state.seatLabel=null; state.flightId=null;
    $('seatMeta').textContent = f.airline+' '+f.flightNo+'　'+state.date+'　'+f.dep+' – '+f.arr;
    const grid=$('seatGrid');
    grid.style.display='block';
    grid.innerHTML='<div class="ai-loading"><div class="ai-loading-bar"></div><p>正在鎖定即時座位圖…</p></div>';
    $('seatError').style.display='none';
    goStep(3);
    try{
      const paxTotal = state.adults+state.children+state.infants;
      const selRes = await fetch('/api/select-offer', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ source:f.source, localFlightId:f.localFlightId, airline:f.airline, flightNo:f.flightNo, dep:f.dep, arr:f.arr, duration:f.duration, stops:f.stops, totalPrice:f.totalPrice, currency:f.currency, from:state.fromLabel, to:state.toLabel, pax:paxTotal })
      });
      const sel = await selRes.json();
      if(!selRes.ok) throw new Error(sel.error || 'select failed');
      state.flightId = sel.flightId; state.currency = sel.currency || f.currency || 'TWD';

      const res = await fetch('/api/flights/'+state.flightId+'/seats');
      const seats = await res.json();
      if(!res.ok) throw new Error(seats.error || 'seats failed');
      grid.style.display='grid';
      grid.innerHTML='';
      seats.forEach(function(s){
        const b=document.createElement('button');
        b.type='button'; b.className='seat'+(s.taken?' taken':''); b.textContent=s.seatNumber;
        if(!s.taken){ b.addEventListener('click', function(){ selectSeat(s.id, s.seatNumber, b); }); }
        grid.appendChild(b);
      });
    }catch(e){
      grid.style.display='block';
      grid.innerHTML='<p class="error" style="margin:0;">座位讀取失敗，請返回重試</p>';
    }
  }

  function selectSeat(seatId, seatLabel, el){
    document.querySelectorAll('.seat.sel').forEach(function(s){ s.classList.remove('sel'); });
    el.classList.add('sel'); state.seatId=seatId; state.seatLabel=seatLabel; $('seatError').style.display='none';
  }

  $('backTo2').addEventListener('click', function(){ goStep(2); });
  $('toStep4').addEventListener('click', function(){
    if(!state.seatId){ $('seatError').textContent='請先選擇一個座位'; $('seatError').style.display=''; return; }
    goStep(4);
  });
  $('backTo3').addEventListener('click', function(){ goStep(3); });

  ['nameInp','emailInp','phoneInp'].forEach(function(id){ $(id).addEventListener('input', function(){ $('passError').style.display='none'; }); });

  function sumRow(k,v){ return '<div class="sum-row"><span class="k">'+k+'</span><span>'+v+'</span></div>'; }

  $('toConfirm').addEventListener('click', async function(){
    const name=$('nameInp').value.trim(), email=$('emailInp').value.trim(), phone=$('phoneInp').value.trim();
    if(!name||!email||!phone||email.indexOf('@')===-1){ $('passError').textContent='請完整填寫姓名、Email 與電話'; $('passError').style.display=''; return; }
    $('passError').style.display='none';

    const paxTotal = state.adults+state.children+state.infants;
    const btn = $('toConfirm'); btn.disabled = true;
    try{
      const res = await fetch('/api/bookings', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ flightId: state.flightId, seatId: state.seatId, name, email, phone, pax: paxTotal, from: state.fromLabel, to: state.toLabel, date: state.date })
      });
      const data = await res.json();
      if(!res.ok){ $('passError').textContent = data.error || '訂購失敗，請稍後再試'; $('passError').style.display=''; return; }

      $('refCode').textContent = data.referenceCode;
      $('summaryCard').innerHTML =
        sumRow('航班', state.flight.airline+' '+state.flight.flightNo)+
        sumRow('航線', state.fromLabel+' → '+state.toLabel)+
        sumRow('日期時間', state.date+'　'+state.flight.dep+' – '+state.flight.arr)+
        sumRow('座位', state.seatLabel)+
        sumRow('乘客', name+'　x '+paxTotal)+
        '<div class="sum-total"><span>總金額</span><span>'+fmtMoney(data.totalPrice, state.currency)+'</span></div>';
      goStep(5);
    }catch(e){
      $('passError').textContent='連線失敗，請稍後再試';
      $('passError').style.display='';
    }finally{
      btn.disabled = false;
    }
  });

  $('restartBtn').addEventListener('click', function(){
    state.flight=null; state.flightId=null; state.seatId=null; state.seatLabel=null;
    $('nameInp').value=''; $('emailInp').value=''; $('phoneInp').value='';
    goStep(1);
  });

  goStep(1);
})();
</script>
</body>
</html>
